name: CI — API

# PR checks only — pushes to main run the same typecheck + tests as the
# gating job inside .github/workflows/deploy-api.yml.

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/docs/openapi.json"
      - "packages/db/**"
      - "packages/auth/**"
      - "packages/config/**"
      - "packages/sdk/**"
      - "packages/integrations/n8n-node/**"
      - "packages/integrations/zapier-app/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/ci-api.yml"

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: cd packages/db && bun run tsc --noEmit
      - run: cd packages/auth && bun run tsc --noEmit
      - name: Verify generated API Worker types
        working-directory: apps/api
        run: bun run types:check
      - run: cd apps/api && bun run tsc --noEmit

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Run API tests (isolated per-file)
        working-directory: apps/api
        run: bun run test
      - name: Run workerd platform integration tests
        working-directory: apps/api
        run: bun run test:workerd

  contracts:
    name: API, SDK, and integrations contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Verify pinned OpenAPI is from this checkout
        working-directory: apps/api
        run: bun run openapi:check
      - name: Verify generated API reference is current
        working-directory: apps/docs
        run: bun run docs:check
      - name: Verify TypeScript SDK package
        working-directory: packages/sdk
        run: |
          bun run typecheck
          bun test
          bun run test:package
      - name: Test n8n contract
        working-directory: packages/integrations/n8n-node
        run: bun run test
      - name: Build n8n node
        working-directory: packages/integrations/n8n-node
        run: bun run build
      - name: Test Zapier workflows
        working-directory: packages/integrations/zapier-app
        run: bun run test
      - name: Build Zapier app
        working-directory: packages/integrations/zapier-app
        run: bun run build
