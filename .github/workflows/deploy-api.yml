name: Deploy API

# Pushes run the complete validation gate and deploy only when production is
# already on the reviewed migration. Applying a pending production migration
# requires an explicit manual run. External backup policy is operated outside
# this repository and is not represented by a misleading workflow checkbox.
#
# Required repository secrets:
# - CLOUDFLARE_API_TOKEN (Workers edit plus Cloudflare Containers edit/access)
# - CLOUDFLARE_ACCOUNT_ID  (relay account: 3496f40fcd55a91da50ded8abea2cf7a)
# - DOTENVX_ARMOR_TOKEN (required after apps/api/.production.secrets.vault is configured)
#
# Required `production` environment configuration:
# - PRODUCTION_DATABASE_URL (migration role, protected TCP host, port 5433,
#   and sslmode=verify-full)
# - PRODUCTION_DATABASE_HOSTNAME
# - PRODUCTION_DATABASE_CA_CERT
# - PRODUCTION_DATABASE_ACCESS_CLIENT_ID
# - PRODUCTION_DATABASE_ACCESS_CLIENT_SECRET
# Repository environment reviewers should also be configured before launch.

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/db/**"
      - "packages/auth/**"
      - "packages/config/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:
    inputs:
      compatible_app_version_id:
        description: Active relayapi-app version reviewed for identity-deletion-v1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-api-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  baseline-generation-guard:
    name: Hold automatic deploys across a baseline generation change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      automatic_deploy_allowed: ${{ steps.generation.outputs.automatic_deploy_allowed }}
      application_generation: ${{ steps.generation.outputs.application_generation }}
      repository_generation: ${{ steps.generation.outputs.repository_generation }}
      live_generation: ${{ steps.generation.outputs.live_generation }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Compare repository and live baseline generations before database work
        id: generation
        run: bun scripts/check-live-baseline-generation.ts --allow-initial-generation-bootstrap
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  test:
    name: Typecheck + Test API
    needs: baseline-generation-guard
    if: ${{ needs.baseline-generation-guard.outputs.automatic_deploy_allowed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck packages/db
        run: bun run tsc --noEmit
        working-directory: packages/db

      - name: Typecheck packages/auth
        run: bun run tsc --noEmit
        working-directory: packages/auth

      - name: Build TypeScript SDK for app source imported by API contract tests
        run: bun run build
        working-directory: packages/sdk

      - name: Typecheck apps/api
        run: bun run tsc --noEmit
        working-directory: apps/api

      - name: Run API tests (isolated per-file)
        run: bun run test
        working-directory: apps/api

  platform-tests:
    name: Worker Types + Runtime Tests
    needs: baseline-generation-guard
    if: ${{ needs.baseline-generation-guard.outputs.automatic_deploy_allowed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify generated API Worker types
        working-directory: apps/api
        run: bun run types:check

      - name: Run workerd platform integration tests
        working-directory: apps/api
        run: bun run test:workerd

  contracts:
    name: API, SDK, and integrations contract
    needs: baseline-generation-guard
    if: ${{ needs.baseline-generation-guard.outputs.automatic_deploy_allowed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify pinned OpenAPI is from this checkout
        working-directory: apps/api
        run: bun run openapi:check

      - name: Verify generated API reference is current
        working-directory: apps/docs
        run: bun run docs:check

      - name: Verify TypeScript SDK package
        working-directory: packages/sdk
        run: |
          bun run typecheck
          bun test
          bun run test:package

      - name: Test n8n contract
        working-directory: packages/integrations/n8n-node
        run: bun run test

      - name: Build n8n node
        working-directory: packages/integrations/n8n-node
        run: bun run build

      - name: Test Zapier workflows
        working-directory: packages/integrations/zapier-app
        run: bun run test

      - name: Build Zapier app
        working-directory: packages/integrations/zapier-app
        run: bun run build

  migration-gate:
    name: Replay migrations on a clean database
    needs: baseline-generation-guard
    if: ${{ needs.baseline-generation-guard.outputs.automatic_deploy_allowed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg18-bookworm@sha256:12a379b47ad65289572ea0756efc11b7c241a6662833e8af7038cd3b73d647e0
        env:
          POSTGRES_DB: relayapi_migration_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d relayapi_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgresql://postgres:postgres@127.0.0.1:5432/relayapi_migration_test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve migration history comparison base
        id: migration_base
        shell: bash
        env:
          EVENT_BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            base_sha="$EVENT_BEFORE_SHA"
          else
            base_sha="$(git rev-parse HEAD^)"
          fi
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$base_sha" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test baseline rebuild safety controls
        run: bun run --cwd packages/db test:baseline-builder

      - name: Test migration history and policy rejection controls
        run: bun run --cwd packages/db test:migration-contracts

      - name: Test schema, privacy, and durable-store source contracts
        run: bun run --cwd packages/db test:schema-invariants

      - name: Verify migration source ownership
        run: bun run --cwd packages/db migration:source-ownership

      - name: Verify immutable migration manifest
        run: bun run db:migration-manifest

      - name: Verify migration history is append-only
        run: bun run db:migration-append-only
        env:
          MIGRATION_BASE_SHA: ${{ steps.migration_base.outputs.sha }}
          MIGRATION_PROTECTED_REF: HEAD
          RELAYAPI_PRELIVE_BASELINE_RESET: ${{ format('{0}:{1}', steps.migration_base.outputs.sha, github.sha) }}

      - name: Verify expand-contract migration policy
        run: bun run db:migration-policy

      - name: Verify schema contract registry
        run: bun run db:verify-schema-contracts

      - name: Apply migrations to a clean database
        run: bun run --cwd packages/db migrate

      - name: Verify migration replay is idempotent
        run: bun run --cwd packages/db migrate

      - name: Verify migrated database catalog
        run: bun run --cwd packages/db verify:migrations

      - name: Verify migrated catalog against reviewed generation evidence
        run: bun run --cwd packages/db catalog:fingerprint:verify-active

      - name: Verify exact applied migration hashes
        run: bun run --cwd packages/db migration:history:current

  deploy:
    name: Deploy API (migrate only on a reviewed manual run)
    if: ${{ github.ref == 'refs/heads/main' && needs.baseline-generation-guard.outputs.automatic_deploy_allowed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [baseline-generation-guard, test, platform-tests, contracts, migration-gate]
    environment:
      name: production
    steps:
      - name: Require a protected production branch
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
        run: test "$REF_PROTECTED" = "true"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Require a sealed virgin baseline for production
        run: bun run --cwd packages/db baseline:sealed:check

      - name: Start Access-protected production database tunnel
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          PRODUCTION_DATABASE_HOSTNAME: ${{ secrets.PRODUCTION_DATABASE_HOSTNAME }}
          PRODUCTION_DATABASE_CA_CERT: ${{ secrets.PRODUCTION_DATABASE_CA_CERT }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.PRODUCTION_DATABASE_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.PRODUCTION_DATABASE_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          test -n "$PRODUCTION_DATABASE_URL"
          test -n "$PRODUCTION_DATABASE_HOSTNAME"
          test -n "$PRODUCTION_DATABASE_CA_CERT"
          test -n "$TUNNEL_SERVICE_TOKEN_ID"
          test -n "$TUNNEL_SERVICE_TOKEN_SECRET"

          bun -e '
            const url = new URL(process.env.PRODUCTION_DATABASE_URL);
            if (url.protocol !== "postgres:" && url.protocol !== "postgresql:") {
              throw new Error("PRODUCTION_DATABASE_URL must use PostgreSQL");
            }
            if (url.hostname !== process.env.PRODUCTION_DATABASE_HOSTNAME) {
              throw new Error("Migration DSN hostname must match the protected Access hostname");
            }
            if (url.port !== "5433") {
              throw new Error("Migration DSN must target the local cloudflared listener on port 5433");
            }
            if (url.searchParams.get("sslmode") !== "verify-full") {
              throw new Error("Migration DSN must require sslmode=verify-full");
            }
            if (url.username === "relayapi_runtime") {
              throw new Error("The no-DDL Worker runtime role cannot run migrations");
            }
          '

          printf '%s\n' "$PRODUCTION_DATABASE_CA_CERT" > "$RUNNER_TEMP/relayapi-postgres-ca.crt"
          sudo install -m 0644 "$RUNNER_TEMP/relayapi-postgres-ca.crt" \
            /usr/local/share/ca-certificates/relayapi-postgres-ca.crt
          sudo update-ca-certificates

          docker run --detach --rm --pull always --network host \
            --name "relayapi-db-access-${GITHUB_RUN_ID}" \
            --env TUNNEL_SERVICE_TOKEN_ID \
            --env TUNNEL_SERVICE_TOKEN_SECRET \
            cloudflare/cloudflared:2026.6.0@sha256:ba461b8aa9c042156dbd39c38657fe7431bafa063220eab8d5330a523863da9f \
            access tcp \
            --hostname "$PRODUCTION_DATABASE_HOSTNAME" \
            --url 127.0.0.1:5433 \
            --loglevel warn

          # Keep cloudflared's DNS resolution inside its container. Only database
          # clients on the runner resolve the certificate hostname to the listener.
          printf '127.0.0.1\t%s\n' "$PRODUCTION_DATABASE_HOSTNAME" | sudo tee -a /etc/hosts >/dev/null

          ready=false
          for _ in $(seq 1 30); do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/5433' 2>/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = "true"

      - name: Converge production Queue message retention
        run: bun run cloudflare:configure-queue-retention
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify Cloudflare deployment prerequisites
        run: bun run cloudflare:verify-prerequisites
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify Stripe billing contract
        run: >-
          bunx dotenvx run --redact --strict --overload
          --token "$DOTENVX_ARMOR_TOKEN"
          -f apps/api/.production.secrets.vault --
          bun run --cwd apps/api cloudflare:verify-stripe-contract
        env:
          DOTENVX_ARMOR_TOKEN: ${{ secrets.DOTENVX_ARMOR_TOKEN }}

      - name: Verify live API secrets are safe to converge to vault intent
        run: bun run secrets:cf:preflight -- api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DOTENVX_ARMOR_TOKEN: ${{ secrets.DOTENVX_ARMOR_TOKEN }}

      - name: Verify reviewed migration manifest
        run: bun run db:migration-manifest

      - name: Verify migration source ownership
        run: bun run --cwd packages/db migration:source-ownership

      - name: Verify expand-contract migration policy
        run: bun run db:migration-policy

      - name: Verify schema contract registry
        run: bun run db:verify-schema-contracts

      - name: Verify production migration history preflight
        run: bun run --cwd packages/db migration:history
        env:
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - name: Capture currently deployed Worker version
        id: previous_worker
        run: |
          set -euo pipefail
          version_id="$(bunx wrangler deployments status --json | jq -er '
            if (.versions | length) == 1 and .versions[0].percentage == 100
            then .versions[0].version_id
            else error("expected one Worker version at 100% traffic")
            end
          ')"
          printf 'version_id=%s\n' "$version_id" >> "$GITHUB_OUTPUT"
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify active dashboard supports identity-deletion-v1
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          test -n "$COMPATIBLE_APP_VERSION_ID"
          EXPECTED_WORKER_VERSION_ID="$COMPATIBLE_APP_VERSION_ID" \
            bun scripts/verify-cloudflare-worker-deployment.ts app
        env:
          COMPATIBLE_APP_VERSION_ID: ${{ inputs.compatible_app_version_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply reviewed production migrations
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: bun run --cwd packages/db migrate
        env:
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - name: Verify production catalog
        run: bun run --cwd packages/db verify:migrations
        env:
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - name: Verify production catalog against reviewed generation evidence
        run: bun run --cwd packages/db catalog:fingerprint:verify-active
        env:
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - name: Verify production migration hashes are current
        run: bun run --cwd packages/db migration:history:current
        env:
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - name: Verify Cloudflare Containers deployment access
        id: previous_container
        run: |
          set -euo pipefail
          applications="$(bunx wrangler containers list --json)"
          printf '%s' "$applications" | jq -e 'type == "array"' >/dev/null
          previous_image="$(printf '%s' "$applications" | jq -er '
            [.[] | select(.name == "relayapi-media-processor")]
            | if length == 0 then ""
              elif length == 1 then .[0].image
              else error("expected at most one relayapi-media-processor application")
              end
          ')"
          printf 'image=%s\n' "$previous_image" >> "$GITHUB_OUTPUT"
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Attempt API deploy
        id: deploy_attempt
        run: |
          set -euo pipefail
          output_file="$RUNNER_TEMP/relayapi-api-deploy.jsonl"
          : > "$output_file"
          set +e
          WRANGLER_OUTPUT_FILE_PATH="$output_file" \
            bun run secrets:cf:deploy -- api -- \
              --keep-vars --strict \
              --tag "${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --message "GitHub release ${GITHUB_SHA} run ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          deploy_exit_code=$?
          set -e
          printf 'exit_code=%s\n' "$deploy_exit_code" >> "$GITHUB_OUTPUT"
          if [ "$deploy_exit_code" -ne 0 ]; then
            echo "::error::Wrangler failed while deploying the Worker and its Container application"
            exit "$deploy_exit_code"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DOTENVX_ARMOR_TOKEN: ${{ secrets.DOTENVX_ARMOR_TOKEN }}

      - name: Resolve the active API release after the deploy attempt
        id: deployed_worker
        run: |
          set -euo pipefail
          output_version_id="$(jq -sr '
            [.[] | select(.type == "deploy" and .worker_name == "relayapi") | .version_id]
            | if length == 0 then ""
              elif length == 1 and .[0] != null then .[0]
              else error("expected at most one relayapi deploy event")
              end
          ' "$RUNNER_TEMP/relayapi-api-deploy.jsonl")"
          active_version="$(bunx wrangler deployments status --json | jq -er '
            if (.versions | length) == 1 and .versions[0].percentage == 100
            then .versions[0].version_id
            else error("expected one Worker version at 100% traffic")
            end
          ')"
          if [ "$active_version" = "${{ steps.previous_worker.outputs.version_id }}" ]; then
            echo "::error::API deploy attempt did not promote a new Worker version (Wrangler exit ${{ steps.deploy_attempt.outputs.exit_code }})"
            exit 1
          fi
          version_json="$(bunx wrangler versions view "$active_version" --json)"
          release_tag="$(printf '%s' "$version_json" | jq -er '.annotations["workers/tag"]')"
          release_message="$(printf '%s' "$version_json" | jq -er '.annotations["workers/message"]')"
          if [ "$release_tag" != "${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ] || \
             [ "$release_message" != "GitHub release ${GITHUB_SHA} run ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" ]; then
            echo "::error::Active API version is not the exact release attempted by this job"
            exit 1
          fi
          if [ -n "$output_version_id" ] && [ "$output_version_id" != "$active_version" ]; then
            echo "::error::Wrangler output disagrees with the active API release"
            exit 1
          fi
          printf 'version_id=%s\n' "$active_version" >> "$GITHUB_OUTPUT"
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify media processor Container application rollout
        run: |
          set -euo pipefail
          applications="$(bunx wrangler containers list --json)"
          application="$(printf '%s' "$applications" | jq -ec '
            [.[] | select(.name == "relayapi-media-processor")]
            | if length == 1 then .[0]
              else error("expected exactly one relayapi-media-processor application")
              end
          ')"
          printf '%s' "$application" | jq -e '
            (.state == "ready" or .state == "active") and
            (.image | type == "string" and contains("relayapi-media-processor") and contains("@sha256:")) and
            (.version != null)
          ' >/dev/null
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Run production health and OpenAPI smoke
        run: bun run cloudflare:smoke-production
        working-directory: apps/api

      - name: Re-verify API secrets after deploy
        run: bun run secrets:cf:verify -- api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DOTENVX_ARMOR_TOKEN: ${{ secrets.DOTENVX_ARMOR_TOKEN }}

      - name: Verify API HTTPS edge policy
        run: bun run edge:verify-production -- api

      - name: Verify deployed Cloudflare resources and Worker version
        run: bun run cloudflare:verify-production
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_WORKER_VERSION_ID: ${{ steps.deployed_worker.outputs.version_id }}

      - name: Roll back API code version and verify non-versioned configuration
        # Push deploys run only after the catalog is already current. Code-only
        # rollback is allowed only when the Container image also stayed unchanged.
        # A manual run can apply a forward-only migration;
        # restoring old code against that new schema would require compatibility
        # shims we intentionally do not carry, so manual failures need reviewed
        # forward recovery instead of automatic rollback.
        if: ${{ failure() && github.event_name == 'push' && steps.previous_worker.outputs.version_id != '' }}
        run: |
          set -euo pipefail
          if [ "${{ steps.previous_container.outcome }}" = "success" ]; then
            current_container_image="$(bunx wrangler containers list --json | jq -er '
              [.[] | select(.name == "relayapi-media-processor")]
              | if length == 0 then ""
                elif length == 1 then .[0].image
                else error("expected at most one relayapi-media-processor application")
                end
            ')"
            if [ "$current_container_image" != "${{ steps.previous_container.outputs.image }}" ]; then
              echo "::error::The Container image changed during this release. Worker-only rollback would create an unreviewed code/image pairing; use reviewed forward recovery instead."
              exit 1
            fi
          fi
          active_version="$(bunx wrangler deployments status --json | jq -er '
            if (.versions | length) == 1 and .versions[0].percentage == 100
            then .versions[0].version_id
            else error("expected one Worker version at 100% traffic")
            end
          ')"
          if [ "$active_version" = "${{ steps.previous_worker.outputs.version_id }}" ]; then
            EXPECTED_WORKER_VERSION_ID="$active_version" bun run cloudflare:verify-production
            echo "API already serves the pre-release version; no rollback is needed"
            exit 0
          fi
          version_json="$(bunx wrangler versions view "$active_version" --json)"
          release_tag="$(printf '%s' "$version_json" | jq -er '.annotations["workers/tag"]')"
          if [ "$release_tag" != "${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ]; then
            echo "::error::Refusing rollback because the active API version changed after this release"
            exit 1
          fi
          set +e
          bunx wrangler rollback "${{ steps.previous_worker.outputs.version_id }}" \
            --message "Automated rollback after failed release gate for ${GITHUB_SHA}" \
            --yes
          rollback_exit_code=$?
          set -e
          restored_version="$(bunx wrangler deployments status --json | jq -er '
            if (.versions | length) == 1 and .versions[0].percentage == 100
            then .versions[0].version_id
            else error("expected one Worker version at 100% traffic")
            end
          ')"
          if [ "$restored_version" != "${{ steps.previous_worker.outputs.version_id }}" ]; then
            echo "::error::API rollback did not restore the captured version (Wrangler exit $rollback_exit_code)"
            exit 1
          fi
          EXPECTED_WORKER_VERSION_ID="$restored_version" bun run cloudflare:verify-production
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Stop production database tunnel
        if: ${{ always() }}
        run: docker rm --force "relayapi-db-access-${GITHUB_RUN_ID}" >/dev/null 2>&1 || true
