name: Deploy Docs

# The API reference is generated from the pinned OpenAPI document produced by
# this checkout. Production drift is checked separately and never mutates the
# docs build input.
#
# Triggers:
# - push to main touching apps/docs (code/content changes)
# - manual dispatch
#
# Required repository secrets:
# - CLOUDFLARE_API_TOKEN
# - CLOUDFLARE_ACCOUNT_ID  (relay account: 3496f40fcd55a91da50ded8abea2cf7a)

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "apps/api/src/routes/**"
      - "apps/api/src/schemas/**"
      - "apps/api/scripts/export-openapi.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-docs-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    name: Typecheck Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify pinned OpenAPI is from this checkout
        run: bun run openapi:check
        working-directory: apps/api

      - name: Verify generated API reference is current
        run: bun run docs:check
        working-directory: apps/docs

      - name: Typecheck apps/docs
        run: bun run tsc --noEmit
        working-directory: apps/docs

  deploy:
    name: Generate + Build + Deploy Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `build` -> `build:next` regenerates the API reference from the pinned
      # checkout artifact before `next build`.
      - name: Build Docs (OpenNext)
        run: bun run build
        working-directory: apps/docs
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"

      - name: Deploy Docs
        run: bunx wrangler deploy --keep-vars
        working-directory: apps/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
