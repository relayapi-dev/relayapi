name: Deploy Docs

# The API reference is generated from the pinned OpenAPI document produced by
# this checkout. Production drift is checked separately and never mutates the
# docs build input.
#
# Triggers:
# - push to main touching apps/docs (code/content changes)
# - manual dispatch
#
# Required repository secrets:
# - CLOUDFLARE_API_TOKEN
# - CLOUDFLARE_ACCOUNT_ID  (relay account: 3496f40fcd55a91da50ded8abea2cf7a)

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "apps/api/src/routes/**"
      - "apps/api/src/schemas/**"
      - "apps/api/scripts/export-openapi.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-docs-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    name: Typecheck Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify pinned OpenAPI is from this checkout
        run: bun run openapi:check
        working-directory: apps/api

      - name: Verify generated API reference is current
        run: bun run docs:check
        working-directory: apps/docs

      - name: Typecheck apps/docs
        run: bun run tsc --noEmit
        working-directory: apps/docs

  deploy:
    name: Generate + Build + Deploy Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    if: ${{ github.ref == 'refs/heads/main' }}
    environment:
      name: production
    steps:
      - name: Require a protected production branch
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
        run: test "$REF_PROTECTED" = "true"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `build` -> `build:next` regenerates the API reference from the pinned
      # checkout artifact before `next build`.
      - name: Build Docs (OpenNext)
        run: bun run build
        working-directory: apps/docs
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"

      - name: Validate Docs deploy bundle
        run: bun run deploy:dry-run
        working-directory: apps/docs

      - name: Capture currently deployed Worker version
        id: previous_worker
        run: |
          set -euo pipefail
          version_id="$(bunx wrangler deployments status --json | jq -er '
            if (.versions | length) == 1 and .versions[0].percentage == 100
            then .versions[0].version_id
            else error("expected one Worker version at 100% traffic")
            end
          ')"
          printf 'version_id=%s\n' "$version_id" >> "$GITHUB_OUTPUT"
        working-directory: apps/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Attempt Docs deploy
        id: deploy_attempt
        run: |
          set -euo pipefail
          output_file="$RUNNER_TEMP/relayapi-docs-deploy.jsonl"
          : > "$output_file"
          set +e
          WRANGLER_OUTPUT_FILE_PATH="$output_file" \
            bun run deploy -- \
              --keep-vars --strict \
              --tag "${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --message "GitHub release ${GITHUB_SHA} run ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          deploy_exit_code=$?
          set -e
          printf 'exit_code=%s\n' "$deploy_exit_code" >> "$GITHUB_OUTPUT"
        working-directory: apps/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Resolve the active docs release after the deploy attempt
        id: deployed_worker
        run: |
          set -euo pipefail
          output_version_id="$(jq -sr '
            [.[] | select(.type == "deploy" and .worker_name == "relayapi-docs") | .version_id]
            | if length == 0 then ""
              elif length == 1 and .[0] != null then .[0]
              else error("expected at most one relayapi-docs deploy event")
              end
          ' "$RUNNER_TEMP/relayapi-docs-deploy.jsonl")"
          active_version="$(bunx wrangler deployments status --json | jq -er '
            if (.versions | length) == 1 and .versions[0].percentage == 100
            then .versions[0].version_id
            else error("expected one Worker version at 100% traffic")
            end
          ')"
          if [ "$active_version" = "${{ steps.previous_worker.outputs.version_id }}" ]; then
            echo "::error::Docs deploy attempt did not promote a new Worker version (Wrangler exit ${{ steps.deploy_attempt.outputs.exit_code }})"
            exit 1
          fi
          version_json="$(bunx wrangler versions view "$active_version" --json)"
          release_tag="$(printf '%s' "$version_json" | jq -er '.annotations["workers/tag"]')"
          release_message="$(printf '%s' "$version_json" | jq -er '.annotations["workers/message"]')"
          if [ "$release_tag" != "${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ] || \
             [ "$release_message" != "GitHub release ${GITHUB_SHA} run ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" ]; then
            echo "::error::Active docs version is not the exact release attempted by this job"
            exit 1
          fi
          if [ -n "$output_version_id" ] && [ "$output_version_id" != "$active_version" ]; then
            echo "::error::Wrangler output disagrees with the active docs release"
            exit 1
          fi
          if [ "${{ steps.deploy_attempt.outputs.exit_code }}" != "0" ]; then
            echo "::warning::Wrangler exited nonzero after promoting the exact tagged docs release; continuing with post-deploy verification"
          fi
          printf 'version_id=%s\n' "$active_version" >> "$GITHUB_OUTPUT"
        working-directory: apps/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployed Worker version and docs smoke
        run: |
          set -euo pipefail
          EXPECTED_WORKER_VERSION_ID="${{ steps.deployed_worker.outputs.version_id }}" \
            bun ../../scripts/verify-cloudflare-worker-deployment.ts docs
          curl --fail-with-body --silent --show-error --location \
            --retry 5 --retry-delay 3 --retry-all-errors --max-time 20 \
            https://docs.relayapi.dev/ >/dev/null
          bun ../../scripts/verify-production-edge.ts docs
        working-directory: apps/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Roll back docs code version and verify non-versioned configuration
        if: ${{ failure() && steps.previous_worker.outputs.version_id != '' }}
        run: |
          set -euo pipefail
          active_version="$(bunx wrangler deployments status --json | jq -er '
            if (.versions | length) == 1 and .versions[0].percentage == 100
            then .versions[0].version_id
            else error("expected one Worker version at 100% traffic")
            end
          ')"
          if [ "$active_version" = "${{ steps.previous_worker.outputs.version_id }}" ]; then
            EXPECTED_WORKER_VERSION_ID="$active_version" \
              bun ../../scripts/verify-cloudflare-worker-deployment.ts docs
            echo "Docs already serves the pre-release version; no rollback is needed"
            exit 0
          fi
          version_json="$(bunx wrangler versions view "$active_version" --json)"
          release_tag="$(printf '%s' "$version_json" | jq -er '.annotations["workers/tag"]')"
          if [ "$release_tag" != "${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ]; then
            echo "::error::Refusing rollback because the active docs version changed after this release"
            exit 1
          fi
          set +e
          bunx wrangler rollback "${{ steps.previous_worker.outputs.version_id }}" \
            --message "Automated rollback after failed docs smoke for ${GITHUB_SHA}" \
            --yes
          rollback_exit_code=$?
          set -e
          restored_version="$(bunx wrangler deployments status --json | jq -er '
            if (.versions | length) == 1 and .versions[0].percentage == 100
            then .versions[0].version_id
            else error("expected one Worker version at 100% traffic")
            end
          ')"
          if [ "$restored_version" != "${{ steps.previous_worker.outputs.version_id }}" ]; then
            echo "::error::Docs rollback did not restore the captured version (Wrangler exit $rollback_exit_code)"
            exit 1
          fi
          EXPECTED_WORKER_VERSION_ID="$restored_version" \
            bun ../../scripts/verify-cloudflare-worker-deployment.ts docs
        working-directory: apps/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
