name: CI — App

# PR checks only — pushes to main run the same typecheck + tests as the
# gating job inside .github/workflows/deploy-app.yml.

on:
  pull_request:
    paths:
      - "apps/app/**"
      - "packages/db/**"
      - "packages/auth/**"
      - "packages/config/**"
      - "packages/sdk/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/ci-app.yml"

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run build:sdk
      - name: Verify generated App Worker types
        working-directory: apps/app
        run: bun run types:check
      - run: cd apps/app && bun run tsc --noEmit

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Run app tests
        working-directory: apps/app
        run: bun test
