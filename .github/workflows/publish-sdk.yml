# SDK Release & Publish Pipeline
#
# Uses release-please for automated versioning based on Conventional Commits:
#   fix(sdk):  → patch bump (0.0.x)
#   feat(sdk): → minor bump (0.x.0)
#   feat(sdk)!: or BREAKING CHANGE → major bump (x.0.0)
#
# Other prefixes (chore:, docs:, refactor:) are included in the next
# release but won't trigger one on their own.
#
# Flow: push to main → release-please opens a PR → merge PR → npm publish
# Manual dispatch (workflow_dispatch) re-runs release-please to recover from failures.

name: Release & Publish SDK

on:
  push:
    branches: [main]
    paths:
      - "packages/sdk/**"
  workflow_dispatch: # manual trigger

permissions: {}

jobs:
  release-please:
    if: ${{ github.ref == 'refs/heads/main' && github.ref_protected }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs['packages/sdk--release_created'] }}
      version: ${{ steps.release.outputs['packages/sdk--version'] }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.12.0"
          registry-url: "https://registry.npmjs.org"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify SDK package
        working-directory: packages/sdk
        run: |
          bun run typecheck
          bun test
          bun run test:package

      - name: Publish to npm
        working-directory: packages/sdk
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
