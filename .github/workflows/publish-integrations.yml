# Publish OpenClaw skill to ClawHub when integrations change.
# The Claude Code plugin is Git-based — users get updates automatically
# when they run `/plugin marketplace update`.

name: Publish Integrations

on:
  push:
    branches: [main]
    paths:
      - "packages/integrations/**"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Dry run (no actual publish)"
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  publish-openclaw:
    if: ${{ github.ref == 'refs/heads/main' && github.ref_protected }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.12.0"

      - name: Install ClawHub CLI
        run: npm install -g clawhub@0.23.1

      - name: Authenticate with ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLAWHUB_TOKEN"
          clawhub --no-input login --token "$CLAWHUB_TOKEN"
          clawhub whoami

      - name: Publish OpenClaw skill
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
          CLAWHUB_DISABLE_TELEMETRY: "1"
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          # ClawHub derives a new skill's slug and display name from its folder.
          # Stage this integration as "RelayAPI" so it does not try the reserved
          # "openclaw" slug while retaining the product's display-name casing.
          PUBLISH_ROOT="$(mktemp -d)"
          trap 'rm -rf "$PUBLISH_ROOT"' EXIT
          cp -R packages/integrations/openclaw "$PUBLISH_ROOT/RelayAPI"

          ARGS=(
            --root "$PUBLISH_ROOT/RelayAPI"
            --bump "$BUMP"
            --tags latest
            --all
          )

          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi

          clawhub --no-input sync "${ARGS[@]}"

  validate-claude-plugin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.12.0"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.214

      - name: Validate plugin structure
        run: claude plugin validate ./packages/integrations/claude-plugin
