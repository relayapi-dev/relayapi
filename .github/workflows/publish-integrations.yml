# Publish OpenClaw skill to ClawHub when integrations change.
# The Claude Code plugin is Git-based — users get updates automatically
# when they run `/plugin marketplace update`.

name: Publish Integrations

on:
  push:
    branches: [main]
    paths:
      - "packages/integrations/**"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Dry run (no actual publish)"
        required: false
        default: false
        type: boolean

jobs:
  publish-openclaw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ClawHub CLI
        run: npm install -g clawhub@0.23.1

      - name: Authenticate with ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLAWHUB_TOKEN"
          clawhub --no-input login --token "$CLAWHUB_TOKEN"
          clawhub whoami

      - name: Publish OpenClaw skill
        run: |
          BUMP="${{ inputs.bump || 'patch' }}"
          DRY_RUN="${{ inputs.dry_run || 'false' }}"

          # ClawHub derives a new skill's slug and display name from its folder.
          # Stage this integration as "RelayAPI" so it does not try the reserved
          # "openclaw" slug while retaining the product's display-name casing.
          PUBLISH_ROOT="$(mktemp -d)"
          trap 'rm -rf "$PUBLISH_ROOT"' EXIT
          cp -R packages/integrations/openclaw "$PUBLISH_ROOT/RelayAPI"

          ARGS=(
            --root "$PUBLISH_ROOT/RelayAPI"
            --bump "$BUMP"
            --tags latest
            --all
          )

          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi

          clawhub --no-input sync "${ARGS[@]}"
        env:
          CLAWHUB_DISABLE_TELEMETRY: "1"

  validate-claude-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin structure
        run: claude plugin validate ./packages/integrations/claude-plugin
