name: CI — Workflow Supply Chain

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/verify-workflow-supply-chain.py"
      - "scripts/test_verify_workflow_supply_chain.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/verify-workflow-supply-chain.py"
      - "scripts/test_verify_workflow_supply_chain.py"

permissions:
  contents: read

jobs:
  verify:
    name: Immutable actions, images, and toolchains
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.6"

      - name: Verify critical workflow dependencies and permissions
        run: |
          python3 -m unittest scripts/test_verify_workflow_supply_chain.py
          python3 scripts/verify-workflow-supply-chain.py

      - name: Validate GitHub Actions syntax
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}" \
            --output "/tmp/${archive}"
          echo "${ACTIONLINT_SHA256}  /tmp/${archive}" | sha256sum --check
          tar -xzf "/tmp/${archive}" -C /tmp actionlint
          chmod 755 /tmp/actionlint
          /tmp/actionlint .github/workflows/*.yml
