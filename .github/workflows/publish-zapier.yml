name: Push Zapier App

on:
  push:
    branches: [main]
    paths:
      - "packages/integrations/zapier-app/**"
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: packages/integrations/zapier-app
        run: bun run build

      - name: Test workflows against the RelayAPI contract
        working-directory: packages/integrations/zapier-app
        run: bun run test

      - name: Require Zapier deployment key
        env:
          ZAPIER_DEPLOY_KEY: ${{ secrets.ZAPIER_DEPLOY_KEY }}
        run: test -n "$ZAPIER_DEPLOY_KEY"

      - name: Validate
        working-directory: packages/integrations/zapier-app
        run: bun run zapier:validate
        env:
          ZAPIER_DEPLOY_KEY: ${{ secrets.ZAPIER_DEPLOY_KEY }}

      - name: Push to Zapier
        working-directory: packages/integrations/zapier-app
        run: bun run zapier:push
        env:
          ZAPIER_DEPLOY_KEY: ${{ secrets.ZAPIER_DEPLOY_KEY }}
