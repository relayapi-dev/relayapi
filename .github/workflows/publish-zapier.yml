name: Push Zapier App

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-zapier.yml"
      - "packages/integrations/zapier-app/**"
  workflow_dispatch:

permissions: {}

jobs:
  push:
    if: ${{ github.ref == 'refs/heads/main' && github.ref_protected }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.12.0"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: packages/integrations/zapier-app
        run: bun run build

      - name: Test workflows against the RelayAPI contract
        working-directory: packages/integrations/zapier-app
        run: bun run test

      - name: Check for Zapier deployment key
        id: zapier-key
        env:
          ZAPIER_DEPLOY_KEY: ${{ secrets.ZAPIER_DEPLOY_KEY }}
        run: |
          if test -n "$ZAPIER_DEPLOY_KEY"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ZAPIER_DEPLOY_KEY is not configured; build and tests passed, but Zapier deployment was skipped."
          fi

      - name: Validate
        if: steps.zapier-key.outputs.available == 'true'
        working-directory: packages/integrations/zapier-app
        run: bun run zapier:validate
        env:
          ZAPIER_DEPLOY_KEY: ${{ secrets.ZAPIER_DEPLOY_KEY }}

      - name: Push to Zapier
        if: steps.zapier-key.outputs.available == 'true'
        working-directory: packages/integrations/zapier-app
        run: bun run zapier:push
        env:
          ZAPIER_DEPLOY_KEY: ${{ secrets.ZAPIER_DEPLOY_KEY }}
