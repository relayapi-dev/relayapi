name: Push Zapier App

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-zapier.yml"
      - "packages/integrations/zapier-app/**"
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: packages/integrations/zapier-app
        run: bun run build

      - name: Test workflows against the RelayAPI contract
        working-directory: packages/integrations/zapier-app
        run: bun run test

      - name: Check for Zapier deployment key
        id: zapier-key
        env:
          ZAPIER_DEPLOY_KEY: ${{ secrets.ZAPIER_DEPLOY_KEY }}
        run: |
          if test -n "$ZAPIER_DEPLOY_KEY"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ZAPIER_DEPLOY_KEY is not configured; build and tests passed, but Zapier deployment was skipped."
          fi

      - name: Validate
        if: steps.zapier-key.outputs.available == 'true'
        working-directory: packages/integrations/zapier-app
        run: bun run zapier:validate
        env:
          ZAPIER_DEPLOY_KEY: ${{ secrets.ZAPIER_DEPLOY_KEY }}

      - name: Push to Zapier
        if: steps.zapier-key.outputs.available == 'true'
        working-directory: packages/integrations/zapier-app
        run: bun run zapier:push
        env:
          ZAPIER_DEPLOY_KEY: ${{ secrets.ZAPIER_DEPLOY_KEY }}
