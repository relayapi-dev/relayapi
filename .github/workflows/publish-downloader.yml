name: Build & Publish Downloader

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-downloader

on:
  push:
    branches: [main]
    paths:
      - "apps/downloader/**"
      - ".github/workflows/publish-downloader.yml"
  workflow_dispatch: # manual trigger

permissions: {}

jobs:
  build-and-push:
    if: ${{ github.ref == 'refs/heads/main' && github.ref_protected }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.6"

      - uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.2
        with:
          version: "0.11.29"

      - name: Verify hash-locked Python dependencies
        working-directory: apps/downloader
        run: |
          cp requirements.lock /tmp/relayapi-downloader-requirements.lock
          uv pip compile pyproject.toml \
            --python 3.14.6 \
            --generate-hashes \
            --no-annotate \
            --no-header \
            --universal \
            --output-file /tmp/relayapi-downloader-requirements.lock
          cmp requirements.lock /tmp/relayapi-downloader-requirements.lock

      - name: Test downloader
        working-directory: apps/downloader
        env:
          INTERNAL_API_KEY: test-internal-key
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: .
        run: |
          uv run --isolated --no-project \
            --python 3.14.6 \
            --with-requirements requirements.lock \
            --with "pytest==9.1.1" \
            --with "httpx==0.28.1" \
            pytest -p no:cacheprovider

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: "v0.35.0"
          driver-opts: image=moby/buildkit:v0.31.2@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/downloader
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable promotion reference
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          # shellcheck disable=SC2016 # The Markdown backticks and placeholders are intentionally literal.
          test -n "$DIGEST"
          printf 'Promote exactly: `%s@%s`\n' \
            "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
