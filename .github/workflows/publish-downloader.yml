name: Build & Publish Downloader

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-downloader

on:
  push:
    branches: [main]
    paths:
      - "apps/downloader/**"
      - ".github/workflows/publish-downloader.yml"
  workflow_dispatch: # manual trigger

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v8
        with:
          version: "0.8.22"

      - name: Verify hash-locked Python dependencies
        working-directory: apps/downloader
        run: |
          cp requirements.lock /tmp/relayapi-downloader-requirements.lock
          uv pip compile pyproject.toml \
            --python 3.12 \
            --generate-hashes \
            --no-annotate \
            --no-header \
            --universal \
            --output-file /tmp/relayapi-downloader-requirements.lock
          cmp requirements.lock /tmp/relayapi-downloader-requirements.lock

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: apps/downloader
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable promotion reference
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          test -n "$DIGEST"
          printf 'Promote exactly: `%s@%s`\n' \
            "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
