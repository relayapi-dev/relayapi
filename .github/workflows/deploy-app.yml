name: Deploy App

# Tests gate the deploy: typecheck + the app test suite must pass before the
# dashboard worker is deployed.
#
# Required production environment/repository secrets:
# - CLOUDFLARE_API_TOKEN
# - CLOUDFLARE_ACCOUNT_ID  (relay account: 3496f40fcd55a91da50ded8abea2cf7a)
# - DOTENVX_ARMOR_TOKEN (required after apps/app/.production.secrets.vault is configured)

on:
  push:
    branches: [main]
    paths:
      - "apps/app/**"
      - "packages/db/**"
      - "packages/auth/**"
      - "packages/config/**"
      - "packages/sdk/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-app-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  baseline-generation-guard:
    name: Hold automatic deploys across a baseline generation change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      automatic_deploy_allowed: ${{ steps.generation.outputs.automatic_deploy_allowed }}
      application_generation: ${{ steps.generation.outputs.application_generation }}
      repository_generation: ${{ steps.generation.outputs.repository_generation }}
      live_generation: ${{ steps.generation.outputs.live_generation }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Compare repository and live baseline generations before build or deploy
        id: generation
        run: bun scripts/check-live-baseline-generation.ts --allow-initial-generation-bootstrap
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  test:
    name: Typecheck + Test App
    needs: baseline-generation-guard
    if: ${{ needs.baseline-generation-guard.outputs.automatic_deploy_allowed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify migration source ownership
        run: bun run --cwd packages/db migration:source-ownership

      - name: Build SDK (typecheck:app depends on its dist)
        run: bun run build:sdk

      - name: Verify generated App Worker types
        working-directory: apps/app
        run: bun run types:check

      - name: Typecheck apps/app
        run: bun run tsc --noEmit
        working-directory: apps/app

      - name: Run app tests
        run: bun test
        working-directory: apps/app

  deploy:
    name: Build + Deploy App
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [baseline-generation-guard, test]
    if: ${{ github.ref == 'refs/heads/main' && needs.baseline-generation-guard.outputs.automatic_deploy_allowed == 'true' }}
    environment:
      name: production
    steps:
      - name: Require a protected production branch
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
        run: test "$REF_PROTECTED" = "true"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build SDK
        run: bun run build:sdk

      - name: Build App
        run: bun run build
        working-directory: apps/app
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          # Build-time placeholders — runtime values come from worker secrets.
          BETTER_AUTH_SECRET: "github-actions-build-secret"
          BETTER_AUTH_URL: "https://relayapi.dev"
          # Satisfies the local Hyperdrive binding during the SSR build; the
          # deployed worker uses the real HYPERDRIVE binding.
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: "postgres://x:x@localhost:5433/x"

      - name: Validate App deploy bundle
        run: bun run deploy:dry-run
        working-directory: apps/app

      - name: Verify live app secrets are safe to converge to vault intent
        run: bun run secrets:cf:preflight -- app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DOTENVX_ARMOR_TOKEN: ${{ secrets.DOTENVX_ARMOR_TOKEN }}

      - name: Wait for the live API EmailIntentEntrypoint target
        timeout-minutes: 22
        run: |
          set -euo pipefail
          content_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/relayapi/content/v2"
          content_file="$RUNNER_TEMP/relayapi-live-worker-content"
          for attempt in $(seq 1 60); do
            if curl --compressed --fail --silent --show-error \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "$content_url" > "$content_file" && \
              grep --binary-files=text --fixed-strings --quiet \
                "EmailIntentEntrypoint" "$content_file"; then
              echo "The live relayapi Worker exports EmailIntentEntrypoint"
              exit 0
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "::error::The live relayapi Worker does not export EmailIntentEntrypoint; deploy the compatible API before the bound app"
              exit 1
            fi
            sleep 20
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Capture currently deployed Worker version
        id: previous_worker
        run: |
          set -euo pipefail
          version_id="$(bunx wrangler deployments status --json | jq -er '
            if (.versions | length) == 1 and .versions[0].percentage == 100
            then .versions[0].version_id
            else error("expected one Worker version at 100% traffic")
            end
          ')"
          printf 'version_id=%s\n' "$version_id" >> "$GITHUB_OUTPUT"
        working-directory: apps/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Attempt App deploy
        id: deploy_attempt
        run: |
          set -euo pipefail
          output_file="$RUNNER_TEMP/relayapi-app-deploy.jsonl"
          : > "$output_file"
          set +e
          WRANGLER_OUTPUT_FILE_PATH="$output_file" \
            bun run secrets:cf:deploy -- app -- \
              --config dist/server/wrangler.json --keep-vars --strict \
              --tag "${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --message "GitHub release ${GITHUB_SHA} run ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          deploy_exit_code=$?
          set -e
          printf 'exit_code=%s\n' "$deploy_exit_code" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DOTENVX_ARMOR_TOKEN: ${{ secrets.DOTENVX_ARMOR_TOKEN }}

      - name: Resolve the active dashboard release after the deploy attempt
        id: deployed_worker
        run: |
          set -euo pipefail
          output_version_id="$(jq -sr '
            [.[] | select(.type == "deploy" and .worker_name == "relayapi-app") | .version_id]
            | if length == 0 then ""
              elif length == 1 and .[0] != null then .[0]
              else error("expected at most one relayapi-app deploy event")
              end
          ' "$RUNNER_TEMP/relayapi-app-deploy.jsonl")"
          active_version="$(bunx wrangler deployments status --json | jq -er '
            if (.versions | length) == 1 and .versions[0].percentage == 100
            then .versions[0].version_id
            else error("expected one Worker version at 100% traffic")
            end
          ')"
          if [ "$active_version" = "${{ steps.previous_worker.outputs.version_id }}" ]; then
            echo "::error::App deploy attempt did not promote a new Worker version (Wrangler exit ${{ steps.deploy_attempt.outputs.exit_code }})"
            exit 1
          fi
          version_json="$(bunx wrangler versions view "$active_version" --json)"
          release_tag="$(printf '%s' "$version_json" | jq -er '.annotations["workers/tag"]')"
          release_message="$(printf '%s' "$version_json" | jq -er '.annotations["workers/message"]')"
          if [ "$release_tag" != "${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ] || \
             [ "$release_message" != "GitHub release ${GITHUB_SHA} run ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" ]; then
            echo "::error::Active dashboard version is not the exact release attempted by this job"
            exit 1
          fi
          if [ -n "$output_version_id" ] && [ "$output_version_id" != "$active_version" ]; then
            echo "::error::Wrangler output disagrees with the active dashboard release"
            exit 1
          fi
          if [ "${{ steps.deploy_attempt.outputs.exit_code }}" != "0" ]; then
            echo "::warning::Wrangler exited nonzero after promoting the exact tagged dashboard release; continuing with post-deploy verification"
          fi
          printf 'version_id=%s\n' "$active_version" >> "$GITHUB_OUTPUT"
        working-directory: apps/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Re-verify app secrets after deploy
        run: bun run secrets:cf:verify -- app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DOTENVX_ARMOR_TOKEN: ${{ secrets.DOTENVX_ARMOR_TOKEN }}

      - name: Verify deployed Worker version and dashboard smoke
        run: |
          set -euo pipefail
          EXPECTED_WORKER_VERSION_ID="${{ steps.deployed_worker.outputs.version_id }}" \
            bun ../../scripts/verify-cloudflare-worker-deployment.ts app
          curl --fail-with-body --silent --show-error --location \
            --retry 5 --retry-delay 3 --retry-all-errors --max-time 20 \
            https://relayapi.dev/app >/dev/null
          bun ../../scripts/verify-production-edge.ts app
        working-directory: apps/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Roll back dashboard code version and verify non-versioned configuration
        if: ${{ failure() && steps.previous_worker.outputs.version_id != '' }}
        run: |
          set -euo pipefail
          active_version="$(bunx wrangler deployments status --json | jq -er '
            if (.versions | length) == 1 and .versions[0].percentage == 100
            then .versions[0].version_id
            else error("expected one Worker version at 100% traffic")
            end
          ')"
          if [ "$active_version" = "${{ steps.previous_worker.outputs.version_id }}" ]; then
            EXPECTED_WORKER_VERSION_ID="$active_version" \
              bun ../../scripts/verify-cloudflare-worker-deployment.ts app
            echo "Dashboard already serves the pre-release version; no rollback is needed"
            exit 0
          fi
          version_json="$(bunx wrangler versions view "$active_version" --json)"
          release_tag="$(printf '%s' "$version_json" | jq -er '.annotations["workers/tag"]')"
          if [ "$release_tag" != "${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ]; then
            echo "::error::Refusing rollback because the active dashboard version changed after this release"
            exit 1
          fi
          set +e
          bunx wrangler rollback "${{ steps.previous_worker.outputs.version_id }}" \
            --message "Automated rollback after failed dashboard smoke for ${GITHUB_SHA}" \
            --yes
          rollback_exit_code=$?
          set -e
          restored_version="$(bunx wrangler deployments status --json | jq -er '
            if (.versions | length) == 1 and .versions[0].percentage == 100
            then .versions[0].version_id
            else error("expected one Worker version at 100% traffic")
            end
          ')"
          if [ "$restored_version" != "${{ steps.previous_worker.outputs.version_id }}" ]; then
            echo "::error::Dashboard rollback did not restore the captured version (Wrangler exit $rollback_exit_code)"
            exit 1
          fi
          EXPECTED_WORKER_VERSION_ID="$restored_version" \
            bun ../../scripts/verify-cloudflare-worker-deployment.ts app
        working-directory: apps/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
